<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignora los favicon SVG: para la pantalla de inicio necesita PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#00A650" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jumbo Ofertas" />

    <meta name="description" content="Lista de compras inteligente para Jumbo. Escanea productos, detecta ofertas y ahorra." />
    <title>Jumbo Ofertas</title>
    <script>
      // El tema se fija antes de pintar. Si se dejara al efecto de React, la
      // primera imagen sería la del tema por defecto y se vería un destello
      // blanco al abrir la app de noche.
      (function () {
        try {
          var choice = localStorage.getItem('jumbo_theme') || 'system'
          var dark = choice === 'dark' || (choice === 'system' &&
            !window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#030712' : '#f1f5f9')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
